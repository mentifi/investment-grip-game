<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>投資握力ゲーム</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <section class="card">
      <div id="titleArea" class="title-area">
        <div class="title-row">
          <p class="badge">暴落に耐えろ</p>
          <p class="version">v0.3</p>
        </div>
        <h1>投資握力ゲーム</h1>
        <p class="subtitle">あなたは狼狽売りせずに握れるか？</p>
      </div>

      <div id="startScreen" class="screen">
        <p class="lead">
          初期資産100万円。<br>
          現金30万円、株式70万円からスタート。
        </p>

        <h2 class="section-title">どの銘柄を握りますか？</h2>
        <div id="stockChoices" class="stock-choices"></div>

        <button id="startBtn" class="primary-btn">ゲーム開始</button>
      </div>

      <div id="gameScreen" class="screen hidden">
        <div class="top-status">
          <div>
            <span>ターン</span>
            <strong><span id="turn">1</span>/20</strong>
          </div>
          <div>
            <span>総資産</span>
            <strong id="totalAsset">1,000,000円</strong>
          </div>
        </div>

        <div class="news-card">
          <div class="news-head">
            <div>
              <span id="selectedStockName" class="stock-name">AI半導体株</span>
              <p>今日のニュース</p>
            </div>
            <strong id="priceChange" class="price-change">±0%</strong>
          </div>

          <h2 id="newsTitle">ニュース見出し</h2>
          <p id="newsText">ニュース本文</p>
        </div>

        <div class="amount-section">
          <p class="section-mini-title">売買額を選択</p>
          <div class="amount-buttons">
            <button class="amount-btn selected" data-amount="100000">10万</button>
            <button class="amount-btn" data-amount="300000">30万</button>
            <button class="amount-btn" data-amount="500000">50万</button>
            <button class="amount-btn" data-amount="all">全力</button>
          </div>
        </div>

        <div class="actions">
          <button id="sellBtn" class="action-btn sell">売る</button>
          <button id="holdBtn" class="action-btn hold">握る</button>
          <button id="buyBtn" class="action-btn buy">買う</button>
        </div>

        <p id="message" class="message"></p>

        <div class="asset-box">
          <div class="asset-box-head">
            <span>資産内訳</span>
            <span id="drawdown">最大下落率：0%</span>
          </div>

          <div class="asset-row">
            <div class="asset-label">
              <span>現金</span>
              <strong id="cash">300,000円</strong>
            </div>
            <div class="bar-wrap">
              <div id="cashBar" class="bar cash-bar"></div>
            </div>
          </div>

          <div class="asset-row">
            <div class="asset-label">
              <span>株式</span>
              <strong id="stockValue">700,000円</strong>
            </div>
            <div class="bar-wrap">
              <div id="stockBar" class="bar stock-bar"></div>
            </div>
          </div>

          <p id="pfText" class="pf-text">PF：株式70% / 現金30%</p>
        </div>
      </div>

      <div id="resultScreen" class="screen hidden">
        <p class="badge">結果発表</p>
        <h2 id="resultTitle">あなたは握力ゴリラ</h2>

        <div class="result-grid">
          <div>
            <span>最終資産</span>
            <strong id="finalAsset">0円</strong>
          </div>
          <div>
            <span>リターン</span>
            <strong id="finalReturn">0%</strong>
          </div>
          <div>
            <span>最大下落率</span>
            <strong id="maxDrawdown">0%</strong>
          </div>
          <div>
            <span>握力スコア</span>
            <strong id="gripScore">0点</strong>
          </div>
        </div>

        <div class="result-chart-box">
          <div class="asset-box-head">
            <span>資産推移</span>
            <span id="resultStockName">AI半導体株</span>
          </div>
          <canvas id="resultChart" width="640" height="220"></canvas>
        </div>

        <p id="resultComment" class="result-comment"></p>

        <textarea id="shareText" readonly></textarea>

        <div class="result-actions">
          <button id="copyBtn" class="primary-btn">結果をコピー</button>
          <button id="restartBtn" class="secondary-btn">もう一度やる</button>
        </div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
